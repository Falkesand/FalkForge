name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# upload-artifact@v5 still declares a Node 20 runtime; opt all JavaScript
# actions into Node 24 ahead of the 2026-06-16 default switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 because the coverage gate below measures the lines this branch changed,
      # which needs `git merge-base origin/main HEAD`. A shallow clone has no merge base and the
      # gate would silently report nothing to measure.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FalkForge.slnx

      - name: Build
        run: dotnet build FalkForge.slnx --no-restore -c Release

      # Build every example so demo breakage (e.g. a stale API or an analyzer
      # error like S3220) is caught here. The demos solution references ../src/*
      # and restores on its own.
      - name: Build demos
        run: dotnet build demo/FalkForge.Demos.slnx -c Release

      # Provision darice.cub so ICE validation runs in CI.
      # WiX Toolset 3.x ships darice.cub at a known path and installs in ~30s via
      # Chocolatey. If the install fails the test step still passes because
      # MsiCompiler uses SkipWhenCubUnavailable=true by default — but ICE tests
      # that require a cub will skip rather than providing coverage.
      # The probe step below reports exactly what was found so failures are visible.
      - name: Install WiX Toolset (for darice.cub)
        shell: pwsh
        run: |
          $output = choco install wixtoolset -y --no-progress 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::WiX Toolset install failed — ICE validation will not run in this job."
            Write-Host ($output | Select-Object -Last 15 | Out-String)
          }
          # This step is advisory: ICE coverage is desirable but its absence is
          # handled (probe step reports it; tests use SkipWhenCubUnavailable).
          # A lingering non-zero $LASTEXITCODE from choco must not fail the job.
          exit 0

      - name: Probe darice.cub availability
        shell: pwsh
        run: |
          $searchPaths = @(
            "C:\Program Files (x86)\WiX Toolset v3.14",
            "C:\Program Files (x86)\WiX Toolset v3.11",
            "C:\Program Files (x86)\Windows Kits\10\bin",
            "C:\Program Files\Windows Kits\10\bin"
          )
          $found = $null
          foreach ($base in $searchPaths) {
            if (Test-Path $base) {
              $cub = Get-ChildItem -Path $base -Filter "darice.cub" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($cub) { $found = $cub.FullName; break }
            }
          }
          if ($found) {
            Write-Host "darice.cub found: $found"
            Write-Host "ICE validation is ACTIVE for this CI run."
          } else {
            Write-Host "::warning::darice.cub not found on this runner. ICE tests will skip. " +
              "To enable ICE coverage, ensure the Windows SDK or WiX Toolset 3.x is installed."
          }

      # xunit.v3 test projects run on Microsoft.Testing.Platform (MTP), not
      # classic VSTest — `dotnet test --collect:"XPlat Code Coverage"` is a
      # silent no-op here because coverlet.collector never attaches. The
      # dotnet-coverage global tool wraps the whole test invocation via CLR
      # profiler attach instead, which works regardless of test host.
      - name: Install coverage tools
        run: |
          dotnet tool install -g dotnet-coverage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tool install -g dotnet-reportgenerator-globaltool
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The trx is produced by the Microsoft.Testing.Platform native TRX reporter (arguments after the
      # `--` are passed to the test host), NOT the classic VSTest `--logger trx`, which is a silent no-op
      # under MTP and left CI unable to NAME a failing test. Each test project writes its own
      # test-results.trx under its bin/<cfg>/<tfm>/TestResults folder, captured by the artifact upload
      # glob below. The dotnet-coverage wrapper is unchanged (CLR profiler attach around the whole run).
      # FALKFORGE_E2E=1 opts CI into the heavyweight e2e tests (full demo-catalog builds,
      # verify-rebuild ceremony) that a fresh-clone `dotnet test` skips by default so it
      # finishes in minutes. The SignServer container e2e (FalkForge.SignServer.E2E.Tests)
      # additionally requires a Linux container runtime, which windows-latest lacks — those
      # skip here and run for real in the dedicated signserver-e2e job on ubuntu-latest below.
      # -s applies scripts/coverage.settings.xml, the same exclusions the gate below expects.
      # Without it the collector also counts generated code (obj\, .g.cs, .Designer.cs,
      # .AssemblyInfo.cs) and the test assemblies. Run 35439160829 measured that difference:
      # 99,198 lines at 73.8% unfiltered against 56,872 lines at 85.7% filtered, so the gate
      # failed its 80% floor on a solution that was over it.
      - name: Test with coverage
        env:
          FALKFORGE_E2E: '1'
        run: dotnet-coverage collect -s scripts\coverage.settings.xml -f cobertura -o TestResults\coverage\coverage.cobertura.xml 'dotnet test FalkForge.slnx --no-build -c Release -v minimal -- --report-trx --report-trx-filename test-results.trx'

      # Enforces the coverage band. Reads the report the step above already produced, so it adds
      # seconds, not another test run. Prints the solution total, every project worst first, and the
      # coverage of the lines this branch changed.
      #
      # -FailUnder makes the 80 % solution floor fail this job. -MinDiff 0 keeps the changed-lines
      # number reported but not blocking, because no pull request has been measured against it yet.
      # Raise it to 80 once a few PRs have shown what the real number looks like.
      #
      # scripts/coverage-gate.ps1 is a copy of the maintainer's local tool, kept here so CI and
      # outside contributors can run the same gate. See scripts/README.md.
      - name: Coverage gate
        shell: pwsh
        run: ./scripts/coverage-gate.ps1 -UseExisting -FailUnder -MinDiff 0 -BaseRef origin/main

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: |
            TestResults/**
            tests/**/bin/**/TestResults/**
          if-no-files-found: warn

      # Primary report: SRC-ONLY. The raw cobertura file also carries coverage
      # for the test assemblies themselves (test fixtures, FakeSigil helper
      # project) — reportgenerator counts those toward the headline % unless
      # filtered out, which pollutes the number away from the meaningful
      # "how much of our product code is exercised" figure. -assemblyfilters
      # keeps every FalkForge.* production assembly and drops anything ending
      # in .Tests or containing .Tests. (catches FalkForge.Compiler.Msi.Tests.FakeSigil).
      # Demo projects (demo/*) build under a separate solution, but FALKFORGE_E2E=1 makes the
      # e2e tests build and run the whole demo catalog inside this run, so their assemblies do
      # reach the cobertura file. Run 35439160829 listed 01-hello-world, 04-dev-toolkit, sigil
      # and about thirty more. Their names carry no "Demo" token, so the *Demo* filter below
      # does not match them either. They are roughly 2,850 lines at 87-100%, so they move the
      # total by a fraction of a percent, and a local run without FALKFORGE_E2E=1 omits them.
      - name: Generate coverage report (src-only)
        run: reportgenerator "-reports:TestResults\coverage\coverage.cobertura.xml" "-targetdir:CoverageReport" "-reporttypes:JsonSummary;TextSummary" "-assemblyfilters:+FalkForge.*;-FalkForge.*.Tests;-FalkForge.*.Tests.*;-*Demo*"

      - name: Print coverage summary (src-only)
        run: Get-Content CoverageReport\Summary.txt

      # Secondary report: all-assembly (unfiltered), kept as a separate artifact
      # for anyone who wants the raw number including test-project code.
      - name: Generate coverage report (all-assembly)
        run: reportgenerator "-reports:TestResults\coverage\coverage.cobertura.xml" "-targetdir:CoverageReport-AllAssembly" "-reporttypes:JsonSummary;TextSummary"

      - name: Upload coverage report (src-only)
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: CoverageReport/
          if-no-files-found: warn

      - name: Upload coverage report (all-assembly)
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report-all-assembly
          path: CoverageReport-AllAssembly/
          if-no-files-found: warn

  # SignServer container e2e: FalkForge.SignServer.E2E.Tests spins a live keyfactor/signserver-ce
  # LINUX container via Testcontainers, so it needs a Linux Docker daemon — which windows-latest
  # does not have. This dedicated ubuntu-latest job (Docker preinstalled, /var/run/docker.sock
  # native) is the only place in CI these tests actually RUN; on the windows job above they
  # self-skip. The project targets plain net10.0 and references only cross-platform projects
  # (Core, Compiler.Bundle, Engine.Protocol, Signing.SignServer), so building just this project
  # on Linux never touches the net10.0-windows parts of the solution. Runs in parallel with
  # build-and-test, so it does not slow the main job.
  signserver-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Scoped to the one cross-platform e2e project — the full slnx does not build on Linux
      # (net10.0-windows projects). The project IS the filter: it contains exactly the two
      # SignServer container e2e classes (SignServerPodSigningE2ETests,
      # SignServerRotationRevocationE2ETests), so no trait/FQN filter can drift out of sync.
      # FALKFORGE_E2E=1 opts past the heavyweight-e2e gate; the Docker runtime gate then
      # resolves the runner's native Linux daemon. TRX via the MTP-native reporter, same as
      # the windows job.
      - name: Run SignServer container e2e
        env:
          FALKFORGE_E2E: '1'
        run: dotnet test tests/FalkForge.SignServer.E2E.Tests/FalkForge.SignServer.E2E.Tests.csproj -c Release -v minimal -- --report-trx --report-trx-filename signserver-e2e.trx

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: signserver-e2e-test-results
          path: tests/FalkForge.SignServer.E2E.Tests/bin/**/TestResults/**
          if-no-files-found: warn

  engine-source-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Pack managed dependencies
        run: dotnet pack FalkForge.slnx -c Release -o artifacts/nuget -p:FalkForgePackEngine=false -p:RestoreLockedMode=true

      - name: Pack engine sources
        run: dotnet pack src/FalkForge.Engine.Sources/FalkForge.Engine.Sources.csproj -c Release -o artifacts/nuget -p:RestoreLockedMode=true

      - name: Build integration test runner
        run: dotnet build tests/FalkForge.Integration.Tests/FalkForge.Integration.Tests.csproj -c Release -p:RestoreLockedMode=true

      - name: Restore and build the packaged engine and companion
        env:
          FALKFORGE_REQUIRE_SOURCE_FEED: '1'
        run: ./tests/FalkForge.Integration.Tests/bin/Release/net10.0-windows/FalkForge.Integration.Tests.exe -class FalkForge.Integration.Tests.Packaging.EngineSourcePackageTests

  code-quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build FalkForge.slnx -c Release

      - name: Install Roslynator
        run: dotnet tool install -g roslynator.dotnet.cli

      - name: Run Roslynator
        shell: pwsh
        run: |
          $projects = @(
            "src/FalkForge.Core/FalkForge.Core.csproj",
            "src/FalkForge.Compiler.Msi/FalkForge.Compiler.Msi.csproj",
            "src/FalkForge.Compiler.Bundle/FalkForge.Compiler.Bundle.csproj",
            "src/FalkForge.Engine/FalkForge.Engine.csproj",
            "src/FalkForge.Engine.Protocol/FalkForge.Engine.Protocol.csproj",
            "src/FalkForge.Engine.Elevation/FalkForge.Engine.Elevation.csproj",
            "src/FalkForge.Ui/FalkForge.Ui.csproj",
            "src/FalkForge.Cli/FalkForge.Cli.csproj",
            "src/FalkForge.Decompiler/FalkForge.Decompiler.csproj",
            "src/FalkForge.Platform/FalkForge.Platform.csproj",
            "src/FalkForge.Platform.Windows/FalkForge.Platform.Windows.csproj",
            "src/FalkForge.Localization/FalkForge.Localization.csproj"
          )
          $failed = $false
          foreach ($proj in $projects) {
            Write-Host "Analyzing $proj..."
            $result = roslynator analyze $proj --severity-level warning --ignore-compiler-diagnostics -v minimal 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Roslynator found issues in $proj"
              Write-Host $result
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
