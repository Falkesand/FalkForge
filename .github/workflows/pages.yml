name: Deploy Docs to GitHub Pages

# Publishes the FalkForge documentation site — documentation.html (as index.html) plus
# docs/tutorials/*.html — to GitHub Pages. No markdown, no internal plans/design docs;
# same HTML-only surface as scripts/pack-docs.ps1 produces for the release zip.
#
# Both jobs are gated on the PAGES_ENABLED repository variable. GitHub offers no workflow
# expression for "Pages is enabled", so the variable stands in for one, and the jobs show
# as skipped rather than failed whenever it is unset.
#
# The gate is currently open. The repository is public, PAGES_ENABLED is true, and Pages
# builds from GitHub Actions, so every push to main republishes the site.
#
# To stop publishing, clear the PAGES_ENABLED variable under
# Settings -> Secrets and variables -> Actions -> Variables.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; never cancel one mid-flight in favor of a newer
# push landing right after — let each publish finish so Pages never serves a half state.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Stage documentation site
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          mkdir -p "$site/docs/tutorials"

          # documentation.html is the self-contained manual; publish it under its own
          # name (matches in-repo links) and as index.html (the Pages entry point).
          cp documentation.html "$site/documentation.html"
          cp documentation.html "$site/index.html"

          # docs/tutorials/*.html + shared/ CSS+JS only — no markdown, no internal
          # plans/design docs.
          cp docs/tutorials/*.html "$site/docs/tutorials/"
          if [ -d docs/tutorials/shared ]; then
            cp -r docs/tutorials/shared "$site/docs/tutorials/shared"
          fi

          echo "Staged site contents:"
          find "$site" -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
